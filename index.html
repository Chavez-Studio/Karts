            const list = document.getElementById('top50-list');
            list.innerHTML = '';

                let bgHsl = "bg-transparent";
                if(row.pos === 1) { posColor = "text-yellow-400 font-bold text-lg"; bgHsl="bg-yellow-900/10"; }
                else if(row.pos === 2) { posColor = "text-slate-300 font-bold text-lg"; bgHsl="bg-slate-700/30"; }

                    </div>

        function renderPilots() {

                const best = Math.min(...times).toFixed(3);
                
                const card = document.createElement('div');
                card.className = "bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-sm";
                
                const timesList = times.map((t, i) => `
                    <div class="flex justify-between items-center py-1.5 px-3 text-sm ${i !== times.length-1 ? 'border-b border-slate-700/50' : ''}">
                        <span class="text-slate-500 text-xs w-8">V${i+1}</span>
                        <span class="font-mono ${t == best ? 'text-yellow-400 font-bold' : 'text-slate-300'}">${t.toFixed(3)}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="p-3 bg-slate-700/40 border-b border-slate-700 flex justify-between items-center">
                        <h3 class="font-bold text-white">${name}</h3>
                        <div class="flex gap-2 text-xs text-right">
                            <span class="bg-emerald-900/30 text-emerald-400 px-2 py-0.5 rounded font-mono font-semibold">${best}s</span>
                            <span class="bg-blue-900/30 text-blue-400 px-2 py-0.5 rounded font-semibold">${times.length}v</span>
                        </div>
                    </div>
                    <div class="h-40 overflow-y-auto no-scrollbar bg-slate-800/80">
                        ${timesList}
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function renderPodio() {
            const list = document.getElementById('podio-list');
            list.innerHTML = '';
            
            const podioData = [];
            for (const [name, times] of Object.entries(pilotData)) {
                const best = Math.min(...times);
                podioData.push({ name, best });
            }
            
            podioData.sort((a, b) => a.best - b.best);
            
            podioData.forEach((row, index) => {
                const pos = index + 1;
                let posColor = "text-slate-400 font-medium";
                let bgHsl = "bg-slate-800 border-transparent";
                let icon = "";
                
                if(pos === 1) { 
                    posColor = "text-yellow-400 font-bold text-xl"; 
                    bgHsl = "bg-yellow-900/20 border border-yellow-700/50"; 
                    icon = "🏆"; 
                } else if(pos === 2) { 
                    posColor = "text-slate-300 font-bold text-lg"; 
                    bgHsl = "bg-slate-700/40 border border-slate-600/50"; 
                    icon = "🥈"; 
                } else if(pos === 3) { 
                    posColor = "text-amber-600 font-bold text-lg"; 
                    bgHsl = "bg-amber-900/20 border border-amber-700/50"; 
                    icon = "🥉"; 
                }

                const mb = index !== podioData.length - 1 ? 'mb-3' : '';

                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-4 rounded-xl shadow-sm ${bgHsl} ${mb}`;
                item.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-8 text-center ${posColor}">${icon || pos}</div>
                        <div class="font-bold text-slate-200 text-base tracking-wide">${row.name}</div>
                    </div>
                    <div class="font-mono text-emerald-400 font-bold text-base bg-emerald-900/20 px-3 py-1 rounded-md">
                        ${row.best.toFixed(3)}s
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function switchTab(tabId) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('sec-top50').classList.add('hidden');
            document.getElementById('sec-pilotos').classList.add('hidden');
            document.getElementById('sec-podio').classList.add('hidden');
            
            const tabs = ['top50', 'pilotos', 'podio'];
            tabs.forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                el.classList.remove('nav-active');
                el.classList.add('nav-inactive');
            });

            document.getElementById(`sec-${tabId}`).classList.remove('hidden');
            
            const activeBtn = document.getElementById(`tab-${tabId}`);
            activeBtn.classList.remove('nav-inactive');
            activeBtn.classList.add('nav-active');
        }

        window.onload = () => {
            renderTop50();
            renderPilots();
            renderPodio();
        };
